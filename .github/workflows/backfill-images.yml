name: Backfill Story Images

on:
  # Manual trigger only — run this once to generate images for all existing
  # stories that don't yet have an `image` frontmatter field.
  workflow_dispatch:
    inputs:
      commit_mode:
        description: |
          How to publish the updated story files.
          "pr" opens a pull request for review before merging.
          "direct" commits directly to main (site deploys immediately).
        type: choice
        options:
          - pr
          - direct
        default: pr

permissions:
  contents: write
  pull-requests: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate images for stories without one
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/backfill-images.ts

      # ── Commit mode: pull request (default) ──────────────────────────────
      - name: Open pull request
        if: ${{ github.event.inputs.commit_mode != 'direct' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'story: backfill banner images for existing stories'
          branch: story/backfill-images-${{ github.run_id }}
          delete-branch: true
          title: 'Backfill banner images for existing stories'
          body: |
            This pull request was automatically created by the **Backfill Story Images** workflow.

            Banner images have been generated for all stories that did not yet have one.
            Each updated story file now includes an `image` and an updated `editedAt` field.

            Review the changes and merge to publish.

            _Triggered by: `${{ github.event_name }}`_
          labels: ai-generated

      # ── Commit mode: direct commit ────────────────────────────────────────
      - name: Commit directly to main
        if: ${{ github.event.inputs.commit_mode == 'direct' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'story: backfill banner images for existing stories'
          branch: main
