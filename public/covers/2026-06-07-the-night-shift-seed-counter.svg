<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg"><title>Detailed ink etching of a seed vault at night: a guard's flashlight beam cuts through crosshatched darkness across receding shelf rows, watched by a corner camera.</title>
  <defs>
    <pattern id="hl" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(42)">
      <path d="M-1 3 q3 -.6 5.5 -.1 t5.5 .1 M-1 8.1 q2.6 .5 5.4 0 t5.6 -.2" stroke="#1a1a18" stroke-width=".7" fill="none"/>
    </pattern>
    <pattern id="hm" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <path d="M-1 2 q2.4 -.5 4.4 0 t3.6 .2 M-1 5.6 q2 .4 4 0 t4 -.3" stroke="#1a1a18" stroke-width=".85" fill="none"/>
    </pattern>
    <pattern id="xm" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-1 1.6 L9 7.4 M-1 6.5 L9 12.3 M-1 -3.2 L9 2.6 M1.5 9 L7.3 -1 M5.8 9.4 L11.6 -.6 M-2.8 8.6 L3 -1.4" stroke="#1a1a18" stroke-width=".75" fill="none"/>
    </pattern>
    <pattern id="xd" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M-1 1 L7 5 M-1 4 L7 8 M-1 -2 L7 2 M1 7 L5 -1 M4 8 L8 0 M-2 6 L2 -2 M-1 5.7 H7" stroke="#1a1a18" stroke-width=".95" fill="none"/>
    </pattern>
    <pattern id="xx" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M-1 1 L6 4.5 M-1 3.5 L6 7 M0 6 L5 -1 M3 6.5 L7 0 M-1 4.8 H6 M2.4 -1 V6" stroke="#1a1a18" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#fcfbf7"/>

  <!-- the dark vault: layered crosshatch -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#xm)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#xd)" opacity=".7"/>
  <rect x="0" y="0" width="1200" height="160" fill="url(#xx)" opacity=".8"/>
  <rect x="0" y="0" width="260" height="630" fill="url(#xx)" opacity=".55"/>
  <rect x="0" y="500" width="1200" height="130" fill="url(#xx)" opacity=".5"/>

  <!-- shelf rows in the gloom (faint paper lines) -->
  <g stroke="#fcfbf7" fill="none" opacity=".8">
    <path d="M90 130 L250 592 M330 150 L450 592 M560 160 L620 592 M780 150 L750 592 M990 130 L920 592" stroke-width="2.2"/>
    <path d="M90 130 L990 130 M70 230 L1010 226 M50 340 L1040 334 M30 460 L1070 452" stroke-width="1.6"/>
    <path d="M80 180 L1000 176 M60 282 L1024 278 M40 396 L1054 390" stroke-width=".8"/>
  </g>

  <!-- flashlight beam: wedge of paper cutting the dark -->
  <polygon points="966,372 380,160 348,238" fill="#fcfbf7"/>
  <polygon points="966,372 348,238 332,300" fill="#fcfbf7" opacity=".7"/>
  <g stroke="#1a1a18" stroke-width=".7" stroke-dasharray="2 8" fill="none">
    <path d="M956 368 L382 166 M958 374 L354 224 M960 378 L342 268 M962 380 L336 296"/>
  </g>

  <!-- shelf detail revealed inside the beam -->
  <g stroke="#1a1a18" fill="none">
    <path d="M380 160 L450 592" stroke-width="0"/>
    <g stroke-width="2">
      <path d="M362 200 L520 252 M348 246 L560 318"/>
      <path d="M372 206 v40 M400 216 v40 M428 226 v40 M456 234 v42 M484 244 v42"/>
    </g>
    <g stroke-width="1.2">
      <rect x="376" y="212" width="20" height="28" rx="2"/>
      <rect x="404" y="222" width="20" height="28" rx="2"/>
      <rect x="432" y="231" width="20" height="28" rx="2"/>
      <rect x="460" y="240" width="20" height="28" rx="2"/>
      <path d="M380 224 h12 M408 234 h12 M436 243 h12 M464 252 h12"/>
    </g>
    <g fill="#1a1a18" stroke="none">
      <ellipse cx="386" cy="234" rx="2.6" ry="1.7"/><ellipse cx="414" cy="244" rx="2.6" ry="1.7"/><ellipse cx="442" cy="253" rx="2.6" ry="1.7"/><ellipse cx="470" cy="262" rx="2.6" ry="1.7"/>
    </g>
    <!-- jars further along the beam -->
    <g stroke-width="1.4">
      <path d="M560 290 q-2 -18 12 -20 v-8 h22 v8 q14 2 12 20 v34 h-46z"/>
      <path d="M640 316 q-2 -16 10 -18 v-7 h20 v7 q12 2 10 18 v30 h-40z"/>
      <path d="M566 300 h36 M644 324 h32" stroke-width=".8"/>
      <circle cx="578" cy="310" r="2.4" fill="#1a1a18" stroke="none"/><circle cx="590" cy="316" r="2" fill="#1a1a18" stroke="none"/><circle cx="654" cy="332" r="2.2" fill="#1a1a18" stroke="none"/>
    </g>
    <!-- dust in the beam -->
    <g fill="#1a1a18" stroke="none">
      <circle cx="520" cy="262" r="1.2"/><circle cx="600" cy="280" r="1"/><circle cx="700" cy="316" r="1.2"/><circle cx="780" cy="334" r="1"/><circle cx="850" cy="352" r="1.1"/><circle cx="730" cy="300" r=".9"/>
    </g>
  </g>

  <!-- guard: solid silhouette, right -->
  <g>
    <ellipse cx="1010" cy="600" rx="120" ry="14" fill="url(#xx)"/>
    <path d="M962 592 q-2 -96 30 -148 q12 -20 12 -50 l30 2 q2 36 -14 62 q-30 48 -28 134z" fill="#1a1a18"/>
    <path d="M1004 592 q6 -88 26 -132 q26 8 44 -2 q14 56 10 134z" fill="#1a1a18"/>
    <circle cx="1042" cy="338" r="25" fill="#1a1a18"/>
    <path d="M1018 338 q-4 -22 22 -24 q26 -2 28 20 l8 -2 q2 -8 -2 -14 q-12 -18 -36 -14 q-26 4 -28 30z" fill="#1a1a18"/>
    <path d="M1030 360 l-18 44 q24 14 46 4 l-6 -42z" fill="#1a1a18"/>
    <path d="M1026 372 q-32 10 -52 2 l-12 -6 4 -14 14 6 q22 6 42 -2z" fill="#1a1a18"/>
    <path d="M1066 372 q20 14 24 44 q2 18 -10 22 q-16 4 -36 -6" fill="#1a1a18"/>
    <!-- flashlight in hand -->
    <rect x="938" y="360" width="34" height="18" rx="5" fill="#1a1a18" transform="rotate(-19 955 369)"/>
    <path d="M936 372 l-7 -3 1 -8 7 1z" fill="#fcfbf7" transform="rotate(-19 935 368)"/>
    <!-- belt, radio -->
    <path d="M1006 446 q34 10 62 0 l-2 12 q-28 8 -58 0z" fill="#1a1a18"/>
    <rect x="1062" y="430" width="14" height="20" rx="3" fill="#1a1a18"/>
    <path d="M1069 430 v-10" stroke="#1a1a18" stroke-width="1.6" fill="none"/>
  </g>

  <!-- clipboard under guard's other arm -->
  <g stroke="#1a1a18">
    <rect x="1086" y="380" width="44" height="64" rx="3" fill="#fcfbf7" stroke-width="2" transform="rotate(8 1108 412)"/>
    <g transform="rotate(8 1108 412)" stroke-width=".9" fill="none">
      <path d="M1094 396 h28 M1094 406 h28 M1094 416 h22 M1094 426 h28"/>
      <path d="M1098 384 h20" stroke-width="1.6"/>
    </g>
  </g>

  <!-- security camera, top left corner -->
  <g stroke="#1a1a18" stroke-linecap="round">
    <path d="M36 36 L86 78" stroke-width="4" fill="none"/>
    <g transform="rotate(28 122 96)">
      <rect x="86" y="76" width="78" height="40" rx="8" fill="#fcfbf7" stroke-width="3"/>
      <rect x="94" y="84" width="62" height="24" rx="5" fill="url(#hm)" stroke-width="1.2"/>
      <rect x="164" y="84" width="16" height="24" rx="4" fill="#fcfbf7" stroke-width="2.4"/>
      <circle cx="172" cy="96" r="5" fill="#1a1a18" stroke="none"/>
    </g>
    <circle cx="60" cy="120" r="4" fill="#fcfbf7" stroke="none"/>
    <!-- its gaze: dashed lines toward the beam crossing -->
    <path d="M186 130 Q560 240 930 366" stroke-width="1" stroke-dasharray="3 10" fill="none" stroke="#fcfbf7"/>
    <path d="M180 146 Q520 270 860 380" stroke-width=".8" stroke-dasharray="2 11" fill="none" stroke="#fcfbf7"/>
  </g>

  <!-- floor: faint paper gridlines receding, reflection under beam -->
  <g stroke="#fcfbf7" stroke-width="1" fill="none" opacity=".7">
    <path d="M0 592 H1200 M120 630 L240 560 M420 630 L470 560 M720 630 L700 560"/>
  </g>
  <path d="M520 600 q220 -36 410 -212" stroke="#fcfbf7" stroke-width="2" fill="none" opacity=".5" stroke-dasharray="10 8"/>
  <ellipse cx="640" cy="586" rx="180" ry="14" fill="#fcfbf7" opacity=".35"/>

  <!-- vault door hint, far left -->
  <g stroke="#fcfbf7" fill="none" opacity=".85">
    <circle cx="60" cy="360" r="46" stroke-width="2.2"/>
    <circle cx="60" cy="360" r="30" stroke-width="1.2"/>
    <path d="M60 314 v18 M60 388 v18 M14 360 h18 M88 360 h18 M28 328 l12 12 M92 392 l12 12 M92 328 l-12 12 M28 392 l12 -12" stroke-width="1.6"/>
  </g>
</svg>
