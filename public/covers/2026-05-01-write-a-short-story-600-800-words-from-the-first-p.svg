<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg"><title>Detailed ink etching of a crowded junk drawer seen from above, every object shaded, with one paperclip resting in a clear radiant space.</title>
  <defs>
    <pattern id="hl" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(42)">
      <path d="M-1 3 q3 -.6 5.5 -.1 t5.5 .1 M-1 8.1 q2.6 .5 5.4 0 t5.6 -.2" stroke="#1a1a18" stroke-width=".7" fill="none"/>
    </pattern>
    <pattern id="hm" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <path d="M-1 2 q2.4 -.5 4.4 0 t3.6 .2 M-1 5.6 q2 .4 4 0 t4 -.3" stroke="#1a1a18" stroke-width=".85" fill="none"/>
    </pattern>
    <pattern id="xm" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-1 1.6 L9 7.4 M-1 6.5 L9 12.3 M-1 -3.2 L9 2.6 M1.5 9 L7.3 -1 M5.8 9.4 L11.6 -.6 M-2.8 8.6 L3 -1.4" stroke="#1a1a18" stroke-width=".75" fill="none"/>
    </pattern>
    <pattern id="xd" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M-1 1 L7 5 M-1 4 L7 8 M-1 -2 L7 2 M1 7 L5 -1 M4 8 L8 0 M-2 6 L2 -2 M-1 5.7 H7" stroke="#1a1a18" stroke-width=".95" fill="none"/>
    </pattern>
    <pattern id="st" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="3" r=".7" fill="#1a1a18"/><circle cx="9" cy="6.5" r=".6" fill="#1a1a18"/><circle cx="13.5" cy="2" r=".7" fill="#1a1a18"/><circle cx="5" cy="11" r=".6" fill="#1a1a18"/><circle cx="12" cy="13" r=".7" fill="#1a1a18"/>
    </pattern>
    <pattern id="wd" width="120" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 4 q30 -2.5 60 0 t60 0 M0 13 q26 2.5 58 0 t62 -1" stroke="#1a1a18" stroke-width=".7" fill="none"/>
      <path d="M28 8 q6 -3 12 0 q6 3 12 0" stroke="#1a1a18" stroke-width=".5" fill="none"/>
      <ellipse cx="92" cy="9" rx="5" ry="2" stroke="#1a1a18" stroke-width=".6" fill="none"/>
    </pattern>
    <g id="key" stroke="#1a1a18" stroke-linecap="round" fill="#fcfbf7">
      <circle cx="0" cy="0" r="11" stroke-width="2.4"/>
      <circle cx="0" cy="0" r="4.5" stroke-width="1.6"/>
      <path d="M9 6 L42 28 l-2 7 l-7 -5 l-2 6 l-7 -5 l-3 5 l-8 -6 4 -10" stroke-width="2.2"/>
      <path d="M12 10 L36 27" stroke-width=".8" fill="none"/>
    </g>
    <g id="batt" stroke="#1a1a18">
      <rect x="0" y="0" width="22" height="52" rx="4" fill="url(#hl)" stroke-width="2.2"/>
      <rect x="7" y="-5" width="8" height="6" rx="2" fill="#fcfbf7" stroke-width="1.6"/>
      <path d="M2 14 h18 M2 38 h18" stroke-width=".9" fill="none"/>
      <rect x="3" y="15" width="16" height="22" fill="url(#xm)" stroke="none"/>
    </g>
  </defs>
  <rect width="1200" height="630" fill="#fcfbf7"/>

  <!-- counter top around the drawer -->
  <rect width="1200" height="630" fill="url(#wd)"/>
  <rect width="1200" height="630" fill="url(#hl)" opacity=".35"/>

  <!-- drawer outer frame -->
  <rect x="80" y="50" width="1040" height="530" rx="10" fill="#fcfbf7" stroke="#1a1a18" stroke-width="6"/>
  <rect x="80" y="50" width="1040" height="530" rx="10" fill="url(#wd)"/>
  <rect x="118" y="88" width="964" height="454" rx="6" fill="#fcfbf7" stroke="#1a1a18" stroke-width="3.4"/>
  <!-- inner walls shaded -->
  <path d="M80 50 h1040 v530 h-1040z M118 88 v454 h964 v-454z" fill-rule="evenodd" fill="url(#hm)" opacity=".8"/>
  <g stroke="#1a1a18" stroke-width="1" fill="none">
    <path d="M80 50 L118 88 M1120 50 L1082 88 M80 580 L118 542 M1120 580 L1082 542"/>
    <path d="M99 50 V580 M1101 50 V580" stroke-width=".8"/>
  </g>
  <!-- drawer floor tone and shadows -->
  <rect x="118" y="88" width="964" height="454" fill="url(#st)" opacity=".5"/>
  <path d="M118 88 h964 v40 q-482 18 -964 0z" fill="url(#xm)" opacity=".5"/>
  <path d="M118 502 q482 -18 964 0 v40 h-964z" fill="url(#xm)" opacity=".5"/>

  <!-- divider tray, left section -->
  <g stroke="#1a1a18" fill="none" stroke-width="2.6">
    <path d="M400 88 V542 M118 320 H400"/>
  </g>

  <!-- scissors -->
  <g stroke="#1a1a18" stroke-linecap="round" transform="rotate(24 250 190)">
    <ellipse cx="196" cy="148" rx="16" ry="24" fill="#fcfbf7" stroke-width="3"/>
    <ellipse cx="196" cy="148" rx="8" ry="15" fill="none" stroke-width="1.4"/>
    <ellipse cx="244" cy="138" rx="24" ry="16" fill="#fcfbf7" stroke-width="3"/>
    <ellipse cx="244" cy="138" rx="15" ry="8" fill="none" stroke-width="1.4"/>
    <path d="M206 168 L304 268 l6 -8 -88 -94z" fill="url(#hl)" stroke-width="2.4"/>
    <path d="M236 152 L310 254 l8 -4 -86 -100z" fill="url(#hm)" stroke-width="2.4"/>
    <circle cx="252" cy="178" r="4" fill="#1a1a18" stroke="none"/>
  </g>
  <!-- ball of rubber bands -->
  <g stroke="#1a1a18" fill="none" stroke-width="1.6">
    <circle cx="208" cy="420" r="46" fill="url(#hl)" stroke-width="2.8"/>
    <path d="M166 404 a46 46 0 0 1 84 28 M174 452 a46 46 0 0 1 56 -78 M250 444 a46 46 0 0 1 -86 -10"/>
    <path d="M180 392 q28 -18 56 4 M172 430 q34 22 70 -6 M196 462 q26 8 48 -14"/>
    <path d="M252 400 q10 22 -4 44" stroke-width="1.2"/>
  </g>
  <!-- spool of string -->
  <g stroke="#1a1a18" transform="rotate(-12 318 320)">
    <rect x="288" y="290" width="60" height="60" rx="6" fill="#fcfbf7" stroke-width="2.6"/>
    <path d="M290 300 h56 M290 308 h56 M290 316 h56 M290 324 h56 M290 332 h56 M290 340 h56" stroke-width="1.3" fill="none"/>
    <path d="M348 326 q40 10 64 40 q6 10 -2 16" stroke-width="1.4" fill="none"/>
  </g>

  <!-- top middle: keys -->
  <use href="#key" x="470" y="150"/>
  <use href="#key" x="560" y="200" transform="rotate(40 560 200)"/>
  <use href="#key" x="520" y="120" transform="rotate(-30 520 120)"/>
  <!-- batteries -->
  <use href="#batt" x="650" y="120" transform="rotate(14 661 146)"/>
  <use href="#batt" x="700" y="130" transform="rotate(-8 711 156)"/>
  <use href="#batt" x="745" y="118" transform="rotate(22 756 144)"/>
  <!-- matchbox -->
  <g stroke="#1a1a18" transform="rotate(-7 880 160)">
    <rect x="820" y="120" width="120" height="74" rx="4" fill="url(#hl)" stroke-width="2.8"/>
    <rect x="834" y="132" width="92" height="50" rx="3" fill="#fcfbf7" stroke-width="1.6"/>
    <path d="M838 158 q22 -14 42 0 t42 0" stroke-width="1.1" fill="none"/>
    <rect x="820" y="120" width="120" height="12" fill="url(#st)" stroke="none"/>
    <path d="M946 140 l24 6 m-24 6 l24 2 m-24 6 l23 -2" stroke-width="1.2" fill="none"/>
  </g>
  <!-- dead pens -->
  <g stroke="#1a1a18" stroke-linecap="round">
    <path d="M460 300 L700 270 l4 12 -240 30z" fill="url(#hm)" stroke-width="2.2"/>
    <path d="M700 270 l26 -2 6 8 -28 6z" fill="#1a1a18" stroke-width="1.4"/>
    <path d="M460 300 l-18 4 6 9 16 -4" fill="#fcfbf7" stroke-width="1.8"/>
    <path d="M480 330 L716 320 l2 12 -236 10z" fill="url(#hl)" stroke-width="2.2"/>
    <path d="M716 320 l24 0 4 9 -26 3z" fill="url(#xd)" stroke-width="1.4"/>
  </g>
  <!-- roll of tape -->
  <g stroke="#1a1a18">
    <circle cx="900" cy="320" r="52" fill="url(#hl)" stroke-width="3"/>
    <circle cx="900" cy="320" r="28" fill="#fcfbf7" stroke-width="2.6"/>
    <circle cx="900" cy="320" r="44" fill="none" stroke-width="1"/>
    <circle cx="900" cy="320" r="36" fill="none" stroke-width=".8"/>
    <path d="M946 296 q14 8 10 26 l-12 -2 q2 -12 -6 -18z" fill="#fcfbf7" stroke-width="1.8"/>
  </g>
  <!-- coins -->
  <g stroke="#1a1a18" fill="#fcfbf7">
    <circle cx="1010" cy="240" r="18" stroke-width="2.2"/><circle cx="1010" cy="240" r="13" stroke-width=".9" fill="none"/>
    <circle cx="1042" cy="262" r="18" stroke-width="2.2"/><circle cx="1042" cy="262" r="13" stroke-width=".9" fill="none"/>
    <circle cx="1020" cy="282" r="18" stroke-width="2.2"/><circle cx="1020" cy="282" r="13" stroke-width=".9" fill="none"/>
    <path d="M1004 236 q6 -4 12 0 M1036 258 q6 -4 12 0 M1014 278 q6 -4 12 0" stroke-width=".8" fill="none"/>
  </g>
  <!-- birthday candles -->
  <g stroke="#1a1a18" stroke-linecap="round">
    <path d="M1010 380 l60 30 m-66 -18 l60 30 m-64 -16 l58 28" stroke-width="5" fill="none"/>
    <path d="M1010 380 l60 30 m-66 -18 l60 30 m-64 -16 l58 28" stroke-width="1" fill="none" stroke-dasharray="4 4" stroke="#fcfbf7"/>
  </g>
  <!-- crumpled receipt -->
  <g stroke="#1a1a18" fill="#fcfbf7" stroke-width="1.6">
    <path d="M530 430 l36 -14 30 8 18 24 -10 28 -34 12 -32 -10 -12 -26z"/>
    <path d="M540 442 l24 -10 22 6 12 16 -8 18 -24 8 -20 -8z M566 432 l8 22 m-26 -6 l20 10 m22 -18 l-14 16" stroke-width=".8" fill="none"/>
  </g>
  <path d="M530 430 l36 -14 30 8 18 24 -10 28 -34 12 -32 -10 -12 -26z" fill="url(#hl)" opacity=".4"/>
  <!-- clutter shadows between objects -->
  <path d="M430 200 q40 30 20 70 q30 10 50 40" stroke="#1a1a18" stroke-width="1" fill="none" stroke-dasharray="2 5"/>
  <path d="M770 220 q-20 40 10 70" stroke="#1a1a18" stroke-width="1" fill="none" stroke-dasharray="2 5"/>
  <path d="M960 440 q-30 30 -80 30" stroke="#1a1a18" stroke-width="1" fill="none" stroke-dasharray="2 5"/>

  <!-- the cleared space and the paperclip -->
  <circle cx="760" cy="470" r="86" fill="#fcfbf7"/>
  <g stroke="#1a1a18" stroke-width="1" fill="none">
    <circle cx="760" cy="470" r="86" stroke-dasharray="1.5 7"/>
    <path d="M760 364 v-26 M760 576 v26 M654 470 h-26 M866 470 h26 M686 396 l-20 -20 M834 396 l20 -20 M686 544 l-20 20 M834 544 l20 20" stroke-width="1.3"/>
    <path d="M712 416 l-12 -13 M808 416 l12 -13 M712 524 l-12 13 M808 524 l12 13" stroke-width=".8"/>
  </g>
  <g stroke="#1a1a18" fill="none" stroke-linecap="round" transform="rotate(-18 760 470)">
    <path d="M734 494 V446 a13 13 0 0 1 26 0 v40 a8 8 0 0 1 -16 0 v-34 a4 4 0 0 1 8 0 v30" stroke-width="4"/>
    <path d="M736 496 V446 a13 13 0 0 1 12 -13" stroke-width="1" opacity=".8"/>
  </g>
</svg>
