<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg"><title>Detailed ink etching of a sorting bench: seeds arranged in a graded grid from solid black to bare outline, with tags, a magnifier and tweezers, against a concrete wall.</title>
  <defs>
    <pattern id="hl" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(42)">
      <path d="M-1 3 q3 -.6 5.5 -.1 t5.5 .1 M-1 8.1 q2.6 .5 5.4 0 t5.6 -.2" stroke="#1a1a18" stroke-width=".7" fill="none"/>
    </pattern>
    <pattern id="hm" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <path d="M-1 2 q2.4 -.5 4.4 0 t3.6 .2 M-1 5.6 q2 .4 4 0 t4 -.3" stroke="#1a1a18" stroke-width=".85" fill="none"/>
    </pattern>
    <pattern id="xm" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-1 1.6 L9 7.4 M-1 6.5 L9 12.3 M-1 -3.2 L9 2.6 M1.5 9 L7.3 -1 M5.8 9.4 L11.6 -.6 M-2.8 8.6 L3 -1.4" stroke="#1a1a18" stroke-width=".75" fill="none"/>
    </pattern>
    <pattern id="st" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="3" r=".7" fill="#1a1a18"/><circle cx="9" cy="6.5" r=".6" fill="#1a1a18"/><circle cx="13.5" cy="2" r=".7" fill="#1a1a18"/><circle cx="5" cy="11" r=".6" fill="#1a1a18"/><circle cx="12" cy="13" r=".7" fill="#1a1a18"/>
    </pattern>
    <pattern id="wd" width="120" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 4 q30 -2.5 60 0 t60 0 M0 13 q26 2.5 58 0 t62 -1" stroke="#1a1a18" stroke-width=".7" fill="none"/>
      <ellipse cx="92" cy="9" rx="5" ry="2" stroke="#1a1a18" stroke-width=".6" fill="none"/>
    </pattern>
    <pattern id="blk" width="92" height="46" patternUnits="userSpaceOnUse">
      <path d="M0 .6 q23 -1 46 0 t46 0 M0 23.4 q22 1 46 .2 t46 -.6 M22 .6 q1 11 -.6 22.6 M68 .8 q-1 10 .6 22.4 M45 23.6 q1 11 -.6 22.2" stroke="#1a1a18" stroke-width=".7" fill="none"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#fcfbf7"/>

  <!-- concrete block wall -->
  <rect x="0" y="0" width="1200" height="300" fill="url(#blk)"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#hl)" opacity=".55"/>
  <rect x="0" y="0" width="1200" height="70" fill="url(#xm)" opacity=".7"/>
  <rect x="0" y="0" width="120" height="300" fill="url(#xm)" opacity=".55"/>
  <rect x="1080" y="0" width="120" height="300" fill="url(#xm)" opacity=".55"/>
  <!-- small high window with bars, light wash below it -->
  <g stroke="#1a1a18">
    <rect x="900" y="40" width="170" height="90" fill="#fcfbf7" stroke-width="4"/>
    <path d="M943 40 v90 M986 40 v90 M1029 40 v90" stroke-width="2.6" fill="none"/>
    <path d="M900 85 h170" stroke-width="1.4" fill="none"/>
    <path d="M906 124 q40 -20 60 -50" stroke-width=".7" fill="none" opacity=".7"/>
  </g>
  <polygon points="900,130 1070,130 1140,300 830,300" fill="#fcfbf7" opacity=".85"/>
  <g stroke="#1a1a18" stroke-width=".7" stroke-dasharray="2 9" fill="none">
    <path d="M910 134 L842 296 M952 134 L920 296 M994 134 L998 296 M1036 134 L1072 296 M1066 134 L1132 296"/>
  </g>
  <!-- pinned tags on wall -->
  <g stroke="#1a1a18">
    <g transform="rotate(-4 220 150)">
      <rect x="170" y="110" width="100" height="64" rx="3" fill="#fcfbf7" stroke-width="2.4"/>
      <circle cx="220" cy="118" r="3.5" fill="#1a1a18" stroke="none"/>
      <path d="M182 132 h76 M182 144 h62 M182 156 h76" stroke-width="1" fill="none"/>
    </g>
    <g transform="rotate(3 400 170)">
      <rect x="350" y="130" width="100" height="64" rx="3" fill="#fcfbf7" stroke-width="2.4"/>
      <circle cx="400" cy="138" r="3.5" fill="#1a1a18" stroke="none"/>
      <path d="M362 152 h76 M362 164 h58 M362 176 h70" stroke-width="1" fill="none"/>
    </g>
    <path d="M270 142 q40 16 80 4" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
  </g>

  <!-- sorting bench top, fills lower two thirds -->
  <path d="M0 300 H1200 V630 H0z" fill="url(#wd)"/>
  <path d="M0 300 H1200 V630 H0z" fill="url(#hl)" opacity=".35"/>
  <path d="M0 300 H1200" stroke="#1a1a18" stroke-width="4"/>
  <path d="M0 312 H1200" stroke="#1a1a18" stroke-width="1.2"/>

  <!-- sorting cloth: lighter rectangle the grid sits on -->
  <rect x="120" y="336" width="850" height="250" rx="6" fill="#fcfbf7" stroke="#1a1a18" stroke-width="2.8"/>
  <path d="M132 348 q412 -10 826 0 M132 574 q412 10 826 0" stroke="#1a1a18" stroke-width=".7" fill="none"/>
  <!-- grid rules -->
  <g stroke="#1a1a18" stroke-width=".9" fill="none" opacity=".8">
    <path d="M140 398 H960 M140 460 H960 M140 522 H960"/>
    <path d="M222 344 V578 M304 344 V578 M386 344 V578 M468 344 V578 M550 344 V578 M632 344 V578 M714 344 V578 M796 344 V578 M878 344 V578"/>
  </g>

  <!-- row 1: viability gradient, solid to ghost -->
  <g>
    <circle cx="181" cy="370" r="17" fill="#1a1a18"/>
    <circle cx="263" cy="370" r="17" fill="#1a1a18"/>
    <circle cx="345" cy="370" r="17" fill="none" stroke="#1a1a18" stroke-width="3.4"/>
    <path d="M328 370 a17 17 0 0 1 34 0z" fill="#1a1a18"/>
    <circle cx="427" cy="370" r="17" fill="url(#hm)" stroke="#1a1a18" stroke-width="3"/>
    <circle cx="509" cy="370" r="17" fill="url(#hl)" stroke="#1a1a18" stroke-width="3"/>
    <circle cx="591" cy="370" r="17" fill="url(#st)" stroke="#1a1a18" stroke-width="2.6"/>
    <circle cx="673" cy="370" r="17" fill="none" stroke="#1a1a18" stroke-width="2.2"/>
    <circle cx="755" cy="370" r="17" fill="none" stroke="#1a1a18" stroke-width="1.6" stroke-dasharray="6 5"/>
    <circle cx="837" cy="370" r="17" fill="none" stroke="#1a1a18" stroke-width="1.2" stroke-dasharray="2 7"/>
    <circle cx="919" cy="370" r="17" fill="none" stroke="#1a1a18" stroke-width=".9" stroke-dasharray="1 9"/>
  </g>
  <!-- row 2 -->
  <g>
    <circle cx="181" cy="430" r="17" fill="#1a1a18"/>
    <circle cx="263" cy="430" r="17" fill="none" stroke="#1a1a18" stroke-width="3.4"/>
    <path d="M246 430 a17 17 0 0 1 34 0z" fill="#1a1a18"/>
    <circle cx="345" cy="430" r="17" fill="url(#hm)" stroke="#1a1a18" stroke-width="3"/>
    <circle cx="427" cy="430" r="17" fill="url(#hl)" stroke="#1a1a18" stroke-width="3"/>
    <circle cx="509" cy="430" r="17" fill="url(#st)" stroke="#1a1a18" stroke-width="2.6"/>
    <circle cx="591" cy="430" r="17" fill="none" stroke="#1a1a18" stroke-width="2.2"/>
    <circle cx="673" cy="430" r="17" fill="none" stroke="#1a1a18" stroke-width="1.6" stroke-dasharray="6 5"/>
    <circle cx="755" cy="430" r="17" fill="none" stroke="#1a1a18" stroke-width="1.2" stroke-dasharray="2 7"/>
    <circle cx="837" cy="430" r="17" fill="none" stroke="#1a1a18" stroke-width=".9" stroke-dasharray="1 9"/>
    <circle cx="919" cy="430" r="17" fill="none" stroke="#1a1a18" stroke-width=".8" stroke-dasharray="1 12"/>
  </g>
  <!-- row 3 -->
  <g>
    <circle cx="181" cy="492" r="17" fill="none" stroke="#1a1a18" stroke-width="3.4"/>
    <path d="M164 492 a17 17 0 0 1 34 0z" fill="#1a1a18"/>
    <circle cx="263" cy="492" r="17" fill="url(#hm)" stroke="#1a1a18" stroke-width="3"/>
    <circle cx="345" cy="492" r="17" fill="url(#hl)" stroke="#1a1a18" stroke-width="3"/>
    <circle cx="427" cy="492" r="17" fill="url(#st)" stroke="#1a1a18" stroke-width="2.6"/>
    <circle cx="509" cy="492" r="17" fill="none" stroke="#1a1a18" stroke-width="2.2"/>
    <circle cx="591" cy="492" r="17" fill="none" stroke="#1a1a18" stroke-width="1.6" stroke-dasharray="6 5"/>
    <circle cx="673" cy="492" r="17" fill="none" stroke="#1a1a18" stroke-width="1.2" stroke-dasharray="2 7"/>
    <circle cx="755" cy="492" r="17" fill="none" stroke="#1a1a18" stroke-width=".9" stroke-dasharray="1 9"/>
    <circle cx="837" cy="492" r="17" fill="none" stroke="#1a1a18" stroke-width=".8" stroke-dasharray="1 12"/>
    <circle cx="919" cy="492" r="17" fill="none" stroke="#1a1a18" stroke-width=".7" stroke-dasharray="1 15"/>
  </g>
  <!-- row 4: mostly empty, the count running out -->
  <g>
    <circle cx="181" cy="552" r="17" fill="url(#hl)" stroke="#1a1a18" stroke-width="3"/>
    <circle cx="263" cy="552" r="17" fill="url(#st)" stroke="#1a1a18" stroke-width="2.6"/>
    <circle cx="345" cy="552" r="17" fill="none" stroke="#1a1a18" stroke-width="1.6" stroke-dasharray="6 5"/>
    <circle cx="427" cy="552" r="17" fill="none" stroke="#1a1a18" stroke-width=".9" stroke-dasharray="1 9"/>
    <circle cx="509" cy="552" r="17" fill="none" stroke="#1a1a18" stroke-width=".7" stroke-dasharray="1 15"/>
  </g>

  <!-- magnifier resting over one fading seed -->
  <g stroke="#1a1a18" stroke-linecap="round">
    <circle cx="755" cy="492" r="48" fill="#fcfbf7" stroke-width="4"/>
    <circle cx="755" cy="492" r="40" fill="none" stroke-width="1.6"/>
    <circle cx="755" cy="492" r="26" fill="none" stroke-width="2" stroke-dasharray="3 5"/>
    <path d="M738 478 q10 -10 26 -8" stroke-width="1" fill="none"/>
    <path d="M789 526 L848 588 q10 12 0 22 q-11 9 -22 -2 L710 550z" fill="url(#hm)" stroke-width="3"/>
    <path d="M796 534 L842 584" stroke-width="1" fill="none"/>
  </g>
  <!-- tweezers -->
  <g stroke="#1a1a18" stroke-linecap="round" transform="rotate(-22 1050 420)">
    <path d="M1030 330 q-8 90 14 150 M1064 330 q8 90 -14 150" stroke-width="3.4" fill="none"/>
    <path d="M1030 330 q16 -10 34 0" stroke-width="3" fill="none"/>
    <path d="M1044 480 l3 8 m-1 -8 l-3 8" stroke-width="1.6" fill="none"/>
  </g>
  <!-- small dish of unsorted seeds, bottom left -->
  <g stroke="#1a1a18">
    <ellipse cx="80" cy="600" rx="64" ry="20" fill="#fcfbf7" stroke-width="2.8"/>
    <path d="M22 594 a60 16 0 0 0 116 0" fill="url(#hm)" stroke-width="1.8"/>
    <ellipse cx="50" cy="592" rx="6" ry="3.6" fill="#1a1a18"/><ellipse cx="74" cy="588" rx="6" ry="3.6" fill="#1a1a18"/><ellipse cx="98" cy="592" rx="6" ry="3.6" fill="#1a1a18"/><ellipse cx="64" cy="596" rx="5" ry="3" fill="#1a1a18"/><ellipse cx="112" cy="588" rx="5" ry="3" fill="#1a1a18"/>
  </g>
  <!-- stray seeds and a tally card on the bench -->
  <ellipse cx="1020" cy="560" rx="6" ry="3.6" fill="#1a1a18"/>
  <ellipse cx="1052" cy="576" rx="5" ry="3" fill="#1a1a18"/>
  <ellipse cx="990" cy="590" rx="5" ry="3" fill="#1a1a18"/>
  <g stroke="#1a1a18" transform="rotate(6 1090 330)">
    <rect x="1020" y="320" width="120" height="76" rx="3" fill="#fcfbf7" stroke-width="2.4"/>
    <path d="M1034 338 v22 m10 -22 v22 m10 -22 v22 m10 -22 v22 m-34 -11 l40 -8 M1094 338 v22 m10 -22 v22" stroke-width="1.6" fill="none"/>
    <path d="M1034 374 v14 m10 -14 v14 m10 -14 v14" stroke-width="1.6" fill="none"/>
  </g>
</svg>
