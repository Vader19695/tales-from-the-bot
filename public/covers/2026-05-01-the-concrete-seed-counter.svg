<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg"><title>Detailed ink etching of a concrete basement grow room: hanging lamps pour light over trays of seedlings against block walls and ceiling pipes.</title>
  <defs>
    <pattern id="hl" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(42)">
      <path d="M-1 3 q3 -.6 5.5 -.1 t5.5 .1 M-1 8.1 q2.6 .5 5.4 0 t5.6 -.2" stroke="#1a1a18" stroke-width=".7" fill="none"/>
    </pattern>
    <pattern id="hm" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <path d="M-1 2 q2.4 -.5 4.4 0 t3.6 .2 M-1 5.6 q2 .4 4 0 t4 -.3" stroke="#1a1a18" stroke-width=".85" fill="none"/>
    </pattern>
    <pattern id="xm" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-1 1.6 L9 7.4 M-1 6.5 L9 12.3 M-1 -3.2 L9 2.6 M1.5 9 L7.3 -1 M5.8 9.4 L11.6 -.6 M-2.8 8.6 L3 -1.4" stroke="#1a1a18" stroke-width=".75" fill="none"/>
    </pattern>
    <pattern id="xd" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M-1 1 L7 5 M-1 4 L7 8 M-1 -2 L7 2 M1 7 L5 -1 M4 8 L8 0 M-2 6 L2 -2 M-1 5.7 H7" stroke="#1a1a18" stroke-width=".95" fill="none"/>
    </pattern>
    <pattern id="st" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="3" r=".7" fill="#1a1a18"/><circle cx="9" cy="6.5" r=".6" fill="#1a1a18"/><circle cx="13.5" cy="2" r=".7" fill="#1a1a18"/><circle cx="5" cy="11" r=".6" fill="#1a1a18"/><circle cx="12" cy="13" r=".7" fill="#1a1a18"/><circle cx="1" cy="14.5" r=".5" fill="#1a1a18"/>
    </pattern>
    <pattern id="ho" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(2)">
      <path d="M-1 2.6 q3 -.5 5 0 t5 .2 M-1 7 q2.6 .4 5 0 t5 -.2" stroke="#1a1a18" stroke-width=".7" fill="none"/>
    </pattern>
    <g id="spr" stroke="#1a1a18" fill="none" stroke-linecap="round" stroke-width="1.6">
      <path d="M0 0 q-.6 -7 .4 -12"/>
      <path d="M.2 -9 q-7 -2 -9 -9 q8 -1 9.6 7"/>
      <path d="M.5 -7 q7 -1 9 -8 q-8.4 -2 -9.6 6"/>
    </g>
    <g id="spr2" stroke="#1a1a18" fill="none" stroke-linecap="round" stroke-width="1.4">
      <path d="M0 0 q.8 -6 -.2 -10"/>
      <path d="M0 -8 q-5.6 -1.4 -7.4 -7 q6.6 -.8 7.8 5.4"/>
      <path d="M.2 -6.4 q5.6 -.8 7.2 -6.4 q-6.8 -1.6 -7.8 5"/>
      <path d="M-.1 -3.6 q-4 -.4 -5.4 -4.2"/>
    </g>
  </defs>
  <rect width="1200" height="630" fill="#fcfbf7"/>

  <!-- back wall: concrete block courses -->
  <rect x="0" y="86" width="1200" height="332" fill="url(#hl)"/>
  <g stroke="#1a1a18" fill="none" stroke-width="1.1">
    <path d="M0 132 q300 3 600 0 t600 2 M0 178 q280 -3 600 0 t600 -2 M0 224 q300 2 620 0 t580 2 M0 270 q310 -2 600 0 t600 -2 M0 316 q290 3 600 0 t600 2 M0 362 q300 -2 600 1 t600 -2 M0 408 q300 2 600 0 t600 1"/>
    <path d="M70 88 v44 M210 88 v44 M350 88 v44 M490 88 v44 M630 88 v44 M770 88 v44 M910 88 v44 M1050 88 v44"/>
    <path d="M140 132 v46 M280 132 v46 M420 132 v46 M560 132 v46 M700 132 v46 M840 132 v46 M980 132 v46 M1120 132 v46"/>
    <path d="M70 178 v46 M210 178 v46 M350 178 v46 M490 178 v46 M630 178 v46 M770 178 v46 M910 178 v46 M1050 178 v46"/>
    <path d="M140 224 v46 M280 224 v46 M420 224 v46 M560 224 v46 M700 224 v46 M840 224 v46 M980 224 v46 M1120 224 v46"/>
    <path d="M70 270 v46 M210 270 v46 M350 270 v46 M490 270 v46 M630 270 v46 M770 270 v46 M910 270 v46 M1050 270 v46"/>
    <path d="M140 316 v46 M280 316 v46 M420 316 v46 M560 316 v46 M700 316 v46 M840 316 v46 M980 316 v46 M1120 316 v46"/>
    <path d="M70 362 v46 M210 362 v46 M350 362 v46 M490 362 v46 M630 362 v46 M770 362 v46 M910 362 v46 M1050 362 v46"/>
  </g>
  <!-- wall stains and cracks -->
  <g stroke="#1a1a18" fill="none" stroke-width=".9">
    <path d="M96 88 q4 30 -3 58 q-5 26 2 50" stroke-dasharray="5 3"/>
    <path d="M1062 134 q6 26 -2 52 q-4 22 4 46" stroke-dasharray="6 3"/>
    <path d="M512 90 l6 14 l-5 12 l8 16"/>
  </g>
  <path d="M30 88 h160 v90 q-90 14 -160 0z" fill="url(#xm)" opacity=".55"/>
  <path d="M1010 88 h190 v110 q-100 16 -190 2z" fill="url(#xm)" opacity=".55"/>

  <!-- ceiling: joists and dark depth -->
  <rect x="0" y="0" width="1200" height="86" fill="url(#xm)"/>
  <g stroke="#1a1a18" fill="none">
    <path d="M0 86 H1200" stroke-width="3"/>
    <path d="M40 0 v82 M160 0 v82 M280 0 v82 M400 0 v82 M520 0 v82 M640 0 v82 M760 0 v82 M880 0 v82 M1000 0 v82 M1120 0 v82" stroke-width="2"/>
    <path d="M48 0 v82 M168 0 v82 M288 0 v82 M408 0 v82 M528 0 v82 M648 0 v82 M768 0 v82 M888 0 v82 M1008 0 v82 M1128 0 v82" stroke-width="1"/>
  </g>
  <!-- pipes along ceiling -->
  <g stroke="#1a1a18" fill="#fcfbf7">
    <path d="M0 38 q300 5 600 1 t600 2 v16 q-300 4 -600 0 t-600 1z" stroke-width="2.2"/>
    <path d="M0 50 q300 3 600 0 t600 2" stroke-width=".8" fill="none"/>
    <ellipse cx="250" cy="47" rx="9" ry="13" stroke-width="2"/>
    <ellipse cx="700" cy="46" rx="9" ry="13" stroke-width="2"/>
    <ellipse cx="1080" cy="47" rx="9" ry="13" stroke-width="2"/>
    <path d="M250 60 v14 M700 59 v14 M1080 60 v14" stroke-width="2.4" fill="none"/>
  </g>
  <rect x="0" y="38" width="1200" height="9" fill="url(#hm)" opacity=".7"/>

  <!-- light cones first (erase wall texture), lamps after -->
  <g>
    <polygon points="240,150 60,420 420,420" fill="#fcfbf7"/>
    <polygon points="600,142 420,420 780,420" fill="#fcfbf7"/>
    <polygon points="960,150 780,420 1140,420" fill="#fcfbf7"/>
    <g stroke="#1a1a18" stroke-width=".7" stroke-dasharray="1.5 7" fill="none">
      <path d="M240 152 L66 416 M240 152 L150 418 M240 152 L240 416 M240 152 L330 418 M240 152 L414 416"/>
      <path d="M600 144 L426 416 M600 144 L512 418 M600 144 L600 416 M600 144 L688 418 M600 144 L774 416"/>
      <path d="M960 152 L786 416 M960 152 L872 418 M960 152 L960 416 M960 152 L1048 418 M960 152 L1134 416"/>
    </g>
  </g>
  <!-- hanging lamps -->
  <g stroke="#1a1a18" stroke-linecap="round">
    <path d="M240 86 v40 M600 78 v40 M960 86 v40" stroke-width="2.2" fill="none"/>
    <path d="M204 152 a36 30 0 0 1 72 0z" fill="url(#xd)" stroke-width="3"/>
    <path d="M564 144 a36 30 0 0 1 72 0z" fill="url(#xd)" stroke-width="3"/>
    <path d="M924 152 a36 30 0 0 1 72 0z" fill="url(#xd)" stroke-width="3"/>
    <ellipse cx="240" cy="153" rx="36" ry="7" fill="#fcfbf7" stroke-width="2.4"/>
    <ellipse cx="600" cy="145" rx="36" ry="7" fill="#fcfbf7" stroke-width="2.4"/>
    <ellipse cx="960" cy="153" rx="36" ry="7" fill="#fcfbf7" stroke-width="2.4"/>
    <circle cx="240" cy="156" r="6" fill="#fcfbf7" stroke-width="1.6"/>
    <circle cx="600" cy="148" r="6" fill="#fcfbf7" stroke-width="1.6"/>
    <circle cx="960" cy="156" r="6" fill="#fcfbf7" stroke-width="1.6"/>
  </g>

  <!-- floor -->
  <rect x="0" y="418" width="1200" height="212" fill="url(#ho)" opacity=".8"/>
  <g stroke="#1a1a18" fill="none">
    <path d="M0 418 H1200" stroke-width="2.6"/>
    <path d="M80 630 L188 418 M1120 630 L1012 418" stroke-width="1"/>
    <path d="M300 470 l40 9 l-14 12 l52 13" stroke-width="1.2"/>
    <path d="M880 540 l-34 12 l20 10 l-44 16" stroke-width="1.2"/>
  </g>
  <path d="M0 560 h1200 v70 h-1200z" fill="url(#xm)" opacity=".5"/>
  <path d="M0 418 h120 v212 h-120z" fill="url(#xm)" opacity=".45"/>
  <path d="M1080 418 h120 v212 h-120z" fill="url(#xm)" opacity=".45"/>

  <!-- left bench with two trays -->
  <g stroke="#1a1a18" stroke-linecap="round">
    <path d="M96 432 L470 432 L506 470 L132 470z" fill="#fcfbf7" stroke-width="3.4"/>
    <rect x="96" y="470" width="410" height="10" fill="url(#hm)" stroke-width="2.2"/>
    <path d="M120 480 v118 M480 480 v118 M150 480 v98 M450 480 v98" stroke="#1a1a18" stroke-width="3.4" fill="none"/>
    <path d="M120 540 H480 M120 545 H480" stroke-width="1.4" fill="none"/>
    <path d="M112 436 q90 3 178 0 t172 1" stroke-width=".7" fill="none"/>
  </g>
  <g>
    <path d="M150 416 h150 l10 14 h-168z" fill="url(#hm)" stroke="#1a1a18" stroke-width="2.4"/>
    <path d="M330 416 h150 l10 14 h-168z" fill="url(#hm)" stroke="#1a1a18" stroke-width="2.4"/>
    <rect x="150" y="408" width="152" height="9" fill="url(#st)" stroke="#1a1a18" stroke-width="1.4"/>
    <rect x="330" y="408" width="152" height="9" fill="url(#st)" stroke="#1a1a18" stroke-width="1.4"/>
    <use href="#spr" x="166" y="409"/><use href="#spr2" x="192" y="408"/><use href="#spr" x="220" y="409"/><use href="#spr2" x="247" y="408"/><use href="#spr" x="274" y="409"/>
    <use href="#spr2" x="346" y="408"/><use href="#spr" x="372" y="409"/><use href="#spr2" x="400" y="408"/><use href="#spr" x="428" y="409"/><use href="#spr2" x="456" y="408"/>
  </g>

  <!-- right bench with trays -->
  <g stroke="#1a1a18" stroke-linecap="round">
    <path d="M694 432 L1068 432 L1104 470 L730 470z" fill="#fcfbf7" stroke-width="3.4"/>
    <rect x="694" y="470" width="410" height="10" fill="url(#hm)" stroke-width="2.2"/>
    <path d="M718 480 v118 M1078 480 v118 M748 480 v98 M1048 480 v98" stroke="#1a1a18" stroke-width="3.4" fill="none"/>
    <path d="M718 540 H1078 M718 545 H1078" stroke-width="1.4" fill="none"/>
  </g>
  <g>
    <path d="M748 416 h150 l10 14 h-168z" fill="url(#hm)" stroke="#1a1a18" stroke-width="2.4"/>
    <path d="M928 416 h150 l10 14 h-168z" fill="url(#hm)" stroke="#1a1a18" stroke-width="2.4"/>
    <rect x="748" y="408" width="152" height="9" fill="url(#st)" stroke="#1a1a18" stroke-width="1.4"/>
    <rect x="928" y="408" width="152" height="9" fill="url(#st)" stroke="#1a1a18" stroke-width="1.4"/>
    <use href="#spr2" x="764" y="408"/><use href="#spr" x="790" y="409"/><use href="#spr2" x="818" y="408"/><use href="#spr" x="845" y="409"/><use href="#spr2" x="872" y="408"/>
    <use href="#spr" x="944" y="409"/><use href="#spr2" x="970" y="408"/><use href="#spr" x="998" y="409"/><use href="#spr2" x="1026" y="408"/><use href="#spr" x="1054" y="409"/>
  </g>

  <!-- foreground: watering can and sack of soil -->
  <g stroke="#1a1a18" stroke-linecap="round">
    <path d="M540 530 q-4 -26 14 -30 h64 q18 4 14 30 l-6 60 q-2 12 -14 12 h-52 q-12 0 -14 -12z" fill="url(#hm)" stroke-width="3.6"/>
    <path d="M548 514 q-30 6 -42 34 l10 8 q12 -24 36 -30" fill="#fcfbf7" stroke-width="3"/>
    <path d="M624 516 q26 14 26 44 q0 14 -12 16" fill="none" stroke-width="3"/>
    <path d="M498 548 l-12 -8 m14 16 l-14 -6 m16 14 l-15 -4" stroke-width="1.4" fill="none"/>
    <ellipse cx="586" cy="506" rx="34" ry="8" fill="#fcfbf7" stroke-width="2.6"/>
    <path d="M552 552 q34 8 68 0 M550 572 q36 8 70 0" stroke-width="1" fill="none"/>
  </g>
  <g stroke="#1a1a18" stroke-linecap="round">
    <path d="M58 506 q-8 92 6 116 q44 14 96 0 q12 -28 4 -116 q-52 -14 -106 0z" fill="url(#hl)" stroke-width="3.4"/>
    <path d="M58 506 q54 16 106 0 l8 -22 q-60 -16 -122 0z" fill="url(#st)" stroke="#1a1a18" stroke-width="3"/>
    <path d="M72 540 q40 10 80 0 M70 566 q42 10 84 0 M70 592 q42 10 84 0" stroke-width=".9" fill="none"/>
    <use href="#spr" x="92" y="488"/><use href="#spr2" x="124" y="486"/>
  </g>
</svg>
