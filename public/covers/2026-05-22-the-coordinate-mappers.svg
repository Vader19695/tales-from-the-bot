<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg"><title>Ink drawing of a hand-drawn transit map: three routes in differing line styles with circled stops.</title>
  <rect width="1200" height="630" fill="#fcfbf7"/>
  <g stroke="#1a1a18" fill="none" stroke-linecap="round">
    <rect x="36" y="36" width="1128" height="558" rx="8" stroke-width="6"/>
    <rect x="50" y="50" width="1100" height="530" rx="6" stroke-width="2"/>
    <g stroke-width="1.5" stroke-dasharray="1 10">
      <line x1="240" y1="50" x2="240" y2="580"/>
      <line x1="480" y1="50" x2="480" y2="580"/>
      <line x1="720" y1="50" x2="720" y2="580"/>
      <line x1="960" y1="50" x2="960" y2="580"/>
      <line x1="50" y1="180" x2="1150" y2="180"/>
      <line x1="50" y1="320" x2="1150" y2="320"/>
      <line x1="50" y1="460" x2="1150" y2="460"/>
    </g>
    <path d="M80 520 C 240 460, 300 360, 430 340 S 700 360, 820 260 S 1040 160, 1140 120" stroke-width="8"/>
    <path d="M70 160 C 220 200, 380 160, 520 220 S 780 420, 950 440 S 1100 470, 1150 520" stroke-width="6" stroke-dasharray="22 14"/>
    <path d="M160 80 C 260 240, 420 420, 600 470 S 900 520, 1120 480" stroke-width="6" stroke-dasharray="3 13"/>
    <path d="M100 360 C 300 300, 520 120, 760 130 S 1000 220, 1130 330" stroke-width="3" stroke-dasharray="1 16"/>
    <g fill="#fcfbf7" stroke-width="5">
      <circle cx="430" cy="340" r="13"/>
      <circle cx="820" cy="260" r="13"/>
      <circle cx="520" cy="220" r="13"/>
      <circle cx="950" cy="440" r="13"/>
      <circle cx="600" cy="470" r="13"/>
      <circle cx="760" cy="130" r="13"/>
      <circle cx="160" cy="80" r="10"/>
      <circle cx="80" cy="520" r="10"/>
    </g>
    <g fill="#1a1a18" stroke="none">
      <circle cx="430" cy="340" r="4"/>
      <circle cx="820" cy="260" r="4"/>
      <circle cx="950" cy="440" r="4"/>
    </g>
    <g transform="translate(1080,540)">
      <circle r="34" stroke-width="4"/>
      <polygon points="0,-26 8,0 0,26 -8,0" fill="#1a1a18" stroke="none"/>
      <circle r="4" fill="#fcfbf7" stroke="none"/>
    </g>
    <path d="M70 600 q40 -10 80 0 q40 10 80 0" stroke-width="3"/>
    <g stroke-width="2">
      <path d="M96 96 l28 0 m-14 -14 l0 28" />
      <circle cx="1100" cy="96" r="3" fill="#1a1a18"/>
      <circle cx="1062" cy="120" r="3" fill="#1a1a18"/>
      <circle cx="1116" cy="140" r="3" fill="#1a1a18"/>
    </g>
  </g>
</svg>
